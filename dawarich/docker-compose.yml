# Dawarich self-hosting
# https://dawarich.app/docs/self-hosting/environment-variables/

networks:
  dawarich:
  traefik_net:
    external: true

services:

  dawarich_redis:
    image: redis:7.4-alpine
    container_name: dawarich_redis
    command: >
      redis-server
      --save 900 1
      --save 300 10
      --appendonly no
    networks:
      - dawarich
    volumes:
      - dawarich_shared:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  dawarich_db:
    image: postgis/postgis:17-3.5-alpine
    container_name: dawarich_db
    shm_size: 1G
    volumes:
      - dawarich_db_data:/var/lib/postgresql/data
      - dawarich_shared:/var/shared
    networks:
      - dawarich
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_THIS_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dawarich_development}
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dawarich_development}"
        ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  dawarich_app:
    image: freikin/dawarich:latest
    container_name: dawarich_app

    volumes:
      - dawarich_public:/var/app/public
      - dawarich_watched:/var/app/tmp/imports/watched
      - dawarich_storage:/var/app/storage
      - dawarich_db_data:/dawarich_db_data

    networks:
      - dawarich
      - traefik_net

    stdin_open: true
    tty: true

    entrypoint: web-entrypoint.sh
    command: ["bin/rails", "server", "-p", "3000", "-b", "::"]

    restart: unless-stopped

    environment:
      RAILS_ENV: ${RAILS_ENV:-production}

      REDIS_URL: ${REDIS_URL:-redis://dawarich_redis:6379}

      DATABASE_HOST: ${DATABASE_HOST:-dawarich_db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-CHANGE_THIS_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-dawarich_development}

      APPLICATION_HOSTS: ${APPLICATION_HOSTS:-dawarich.sasvat.me,localhost,::1,127.0.0.1}
      APPLICATION_PROTOCOL: ${APPLICATION_PROTOCOL:-https}
      DOMAIN: ${DOMAIN:-dawarich.sasvat.me}

      TIME_ZONE: ${TIME_ZONE:-Asia/Kolkata}

      PROMETHEUS_EXPORTER_ENABLED: ${PROMETHEUS_EXPORTER_ENABLED:-false}

      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-CHANGE_THIS_TO_A_LONG_RANDOM_SECRET}

      RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:-true}
      SELF_HOSTED: ${SELF_HOSTED:-true}
      STORE_GEODATA: ${STORE_GEODATA:-true}

      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}

      # Uncomment these if you want 2FA
      # OTP_ENCRYPTION_PRIMARY_KEY: ${OTP_ENCRYPTION_PRIMARY_KEY:-}
      # OTP_ENCRYPTION_DETERMINISTIC_KEY: ${OTP_ENCRYPTION_DETERMINISTIC_KEY:-}
      # OTP_ENCRYPTION_KEY_DERIVATION_SALT: ${OTP_ENCRYPTION_KEY_DERIVATION_SALT:-}

    labels:
      - "traefik.enable=true"

      # Router
      - "traefik.http.routers.dawarich.rule=Host(`dawarich.sasvat.me`)"
      - "traefik.http.routers.dawarich.entrypoints=websecure"
      - "traefik.http.routers.dawarich.tls.certresolver=le"
      - "traefik.http.services.dawarich.loadbalancer.server.scheme=http"
      # Dawarich listens on port 3000
      - "traefik.http.services.dawarich.loadbalancer.server.port=3000"
      # Explicitly tell Traefik which network to use
      - "traefik.docker.network=traefik_net"

    logging:
      driver: "json-file"
      options:
        max-size: ${LOG_MAX_SIZE:-100m}
        max-file: ${LOG_MAX_FILE:-5}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO - http://127.0.0.1:3000/api/v1/health | grep -q '\"status\"\\s*:\\s*\"ok\"'"
        ]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s

    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true

    deploy:
      resources:
        limits:
          cpus: ${APP_CPU_LIMIT:-0.50}
          memory: ${APP_MEMORY_LIMIT:-4G}


  dawarich_sidekiq:
    image: freikin/dawarich:latest
    container_name: dawarich_sidekiq

    volumes:
      - dawarich_public:/var/app/public
      - dawarich_watched:/var/app/tmp/imports/watched
      - dawarich_storage:/var/app/storage

    networks:
      - dawarich

    stdin_open: true
    tty: true

    entrypoint: sidekiq-entrypoint.sh
    command: ["sidekiq"]

    restart: unless-stopped

    environment:
      RAILS_ENV: ${RAILS_ENV:-production}

      REDIS_URL: ${REDIS_URL:-redis://dawarich_redis:6379}

      DATABASE_HOST: ${DATABASE_HOST:-dawarich_db}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-CHANGE_THIS_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-dawarich_development}

      APPLICATION_HOSTS: ${APPLICATION_HOSTS:-dawarich.sasvat.me,localhost,::1,127.0.0.1}
      APPLICATION_PROTOCOL: ${APPLICATION_PROTOCOL:-https}

      BACKGROUND_PROCESSING_CONCURRENCY: ${BACKGROUND_PROCESSING_CONCURRENCY:-3}

      PROMETHEUS_EXPORTER_ENABLED: ${PROMETHEUS_EXPORTER_ENABLED:-false}

      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-CHANGE_THIS_TO_A_LONG_RANDOM_SECRET}

      RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:-true}
      SELF_HOSTED: ${SELF_HOSTED:-true}
      STORE_GEODATA: ${STORE_GEODATA:-true}

    logging:
      driver: "json-file"
      options:
        max-size: ${LOG_MAX_SIZE:-100m}
        max-file: ${LOG_MAX_FILE:-5}

    healthcheck:
      test: ["CMD-SHELL", "pgrep -f sidekiq"]
      interval: 10s
      retries: 30
      start_period: 30s
      timeout: 10s

    depends_on:
      dawarich_db:
        condition: service_healthy
        restart: true
      dawarich_redis:
        condition: service_healthy
        restart: true
      dawarich_app:
        condition: service_healthy
        restart: true


volumes:
  dawarich_db_data:
  dawarich_shared:
  dawarich_public:
  dawarich_watched:
  dawarich_storage:
