global:
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true
  debug: true

entryPoints:

  web:
    address: ":80"

    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/32"
        - "10.0.0.0/8"

  websecure:
    address: ":443"

    proxyProtocol:
      trustedIPs:
        - "127.0.0.1/32"
        - "10.0.0.0/8"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false

certificatesResolvers:
  le:
    acme:
      storage: /letsencrypt/acme.json

      httpChallenge:
        entryPoint: web

log:
  level: DEBUG

accessLog: {}
